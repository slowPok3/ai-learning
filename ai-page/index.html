<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Foundations Curriculum</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --text: #e2e8f0; --muted: #94a3b8;
            --panel-width: 400px;
        }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        .view { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }

        /* Views are stacked absolutely on top of each other. The active view is
           made visible via opacity + pointer-events (animated by transition).
           When body.panel-open is set, all views shrink horizontally to make
           room for the slide-in side panel. */
        .view { 
            position: absolute; inset: 0; width: 100%; height: calc(100% - 60px); 
            opacity: 0; pointer-events: none;
            /* ── VIEW-SLIDE-START: entrance slide-up ──────── */
            transform: translateY(8px);
            transition: opacity 0.45s ease, transform 0.45s ease, width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* ── VIEW-SLIDE-END ──────────────────────────── */
            display: block; 
        }

        body.panel-open .view {
            width: calc(100% - var(--panel-width));
        }

        .view.active { 
            opacity: 1; pointer-events: all; 
            /* ── VIEW-SLIDE-START ──── */
            transform: translateY(0);
            /* ── VIEW-SLIDE-END ────── */
        }
        
        /* Sticky header uses pointer-events:none so scroll events pass through
           to the content beneath; the h1 and p opt back in with pointer-events:auto
           so they remain clickable (e.g. selecting text). */
        .page-header { 
            text-align: center; 
            padding-top: 2rem; 
            padding-bottom: 1rem; 
            position: sticky;
            top: 0;
            background: var(--bg); 
            z-index: 100;          
            pointer-events: none;   
        }

        .page-header h1, .page-header p {
            pointer-events: auto;
        }

        .page-header h1 { color: var(--accent); font-size: 2rem; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .page-header p { color: var(--muted); margin-top: .5rem; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .absolute-header { position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
        
        #view-constellation { background: radial-gradient(ellipse at center, #0a0e27 0%, #02040f 100%); }
        #vector-container { width: 100%; height: 100%; }
        #tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 8px; font-size: 13px; display: none; z-index: 20; white-space: nowrap; color: #fff; transition: opacity 0.2s; }
        #hint { position: absolute; bottom: 15px; right: 15px; z-index: 10; font-size: 11px; opacity: 0.6; background: rgba(10,14,39,0.6); padding: 8px 12px; border-radius: 8px; color: #fff; pointer-events: none; }
        
        #mindmap-container { width: 100%; height: 100%; background: #1e293b; }

        .map-controls {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            display: flex;
            gap: 8px;
            justify-content: center;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 24px;
            border: 1px solid #33415577;
            pointer-events: auto;
        }

        .anim-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            color: var(--muted);
            padding: 5px 14px;
            border-radius: 18px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anim-btn:hover {
            color: var(--text);
            border-color: #475569;
        }

        .anim-btn.active-mode {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
            font-weight: 600;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
        }
        
        #view-cards { overflow-y: auto; padding: 0 2rem 2rem 2rem; box-sizing: border-box; background: var(--bg); height: calc(100% - 60px); }
        
        .controls { 
            display: flex; 
            gap: 1rem; 
            flex-wrap: wrap; 
            justify-content: center; 
            margin-bottom: 2rem; 
            position: sticky;
            top: 5.5rem;          
            background: var(--bg);
            padding-bottom: 1.5rem; 
            z-index: 101;            
            pointer-events: all;
        }

        input, select { padding: .6rem 1rem; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: var(--text); font-size: 1rem; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        input { min-width: 280px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding-bottom: 40px; }
        .card { background: var(--card); border-radius: 12px; padding: 1.2rem; border-left: 4px solid var(--accent); transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(56,189,248,.15); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: currentColor; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .card:hover::before { opacity: 0.05; }
        .card .id { font-size: .7rem; color: var(--accent); letter-spacing: 1px; }
        .card h3 { margin: .3rem 0 .5rem; font-size: 1.1rem; color: var(--text); }
        .card p {
            color: var(--muted); font-size: .9rem; line-height: 1.4; margin: 0;
            /* Clamp to 2 lines so cards stay a consistent height; "…" signals more. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .phase-tag { display: inline-block; margin-top: .8rem; font-size: .7rem; background: rgba(56,189,248,.15); color: var(--accent); padding: .2rem .6rem; border-radius: 20px; }
        /* ── CARD-STAGGER-START: entrance animation for card grids ─────── */
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card-enter {
            opacity: 0;
            animation: cardEnter 0.35s ease forwards;
        }
        /* ── CARD-STAGGER-END ──────────────────────────────────────────── */
        .empty { text-align: center; color: var(--muted); grid-column: 1/-1; padding: 2rem; }
        
        #view-visual { overflow-y: auto; padding: 0 2rem 2rem 2rem; box-sizing: border-box; background: var(--bg); }
        .visual-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 18px; margin-top: 14px; padding-bottom: 40px;}
        .visual-card { background: var(--card); border: 1px solid #334155; border-radius: 13px; padding: 18px; transition: border-color 0.25s, transform 0.25s; cursor: pointer; }
        .visual-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .visual-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .visual-card-header h3 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .subject-pill-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
        .subject-pill { font-size: 0.72rem; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
        .moon-tag-list { display: flex; flex-wrap: wrap; gap: 3px; padding-top: 7px; border-top: 1px solid #334155; }
        .moon-tag { font-size: 0.66rem; padding: 2px 7px; border-radius: 20px; }
        .stats-bar { display: flex; justify-content: center; gap: 40px; background: var(--card); border: 1px solid #334155; border-radius: 13px; padding: 18px 24px; margin: 0 auto 26px; max-width: 600px; }
        .stat { text-align: center; }
        .stat-num { font-size: 1.7rem; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
       
        .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--text); }
        
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; gap: 20px; border-top: 1px solid #334155; z-index: 1000; }
        .nav-btn { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 5px 15px; border-radius: 5px; transition: all 0.3s; display: flex; align-items: center; gap: 5px;}
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        
        .dots-container { display: flex; gap: 10px; align-items: center; }
        .nav-dot { width: 10px; height: 10px; border-radius: 5px; background: #475569; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-dot:hover { background: #94a3b8; }
        .nav-dot.active { width: 30px; background: #38bdf8; }
        
        .search-wrapper {
            position: relative;
            display: inline-block;
            min-width: 300px;
        }

        .search-wrapper input {
            width: 100%;
            padding-right: 35px; 
            box-sizing: border-box;
        }

        #custom-clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--muted);
            cursor: pointer;
            display: none; 
            user-select: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            z-index: 110;          
            pointer-events: all;   
            padding: 5px;          
        }

        #custom-clear-btn:hover {
            color: var(--text);
        }

        #side-panel {
            position: fixed;
            top: 0;
            right: calc(-1 * var(--panel-width)); 
            width: var(--panel-width);
            height: calc(100% - 60px); 
            background: var(--card);
            border-left: 4px solid var(--accent);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.3);
            z-index: 1500;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
            box-sizing: border-box;
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
        }

        #side-panel.open {
            right: 0;
        }

        #side-panel .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            :root { --panel-width: 100%; }
            body.panel-open .view { width: 100%; }
            #side-panel { height: 50%; top: auto; bottom: 60px; right: 0; transform: translateY(110%); transition: transform 0.3s ease; }
            #side-panel.open { transform: translateY(0); }

            .page-header h1 { font-size: 1.4rem; }
            .controls { 
                position: sticky;
                top: 4.2rem; 
            }

            .page-header p { font-size: 0.85rem; padding: 0 10px; }
            .absolute-header { padding-top: 1rem; }
            #view-cards, #view-visual { padding: 0 1rem 2rem 1rem; }
            .controls { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            input { min-width: 100%; box-sizing: border-box; }
            select { width: 100%; }

            .grid, .visual-grid { 
                grid-template-columns: 1fr !important; 
                gap: 12px; 
            }

            .stats-bar { gap: 15px; padding: 12px; margin-bottom: 15px; }
            .stat-num { font-size: 1.3rem; }
            #bottom-nav { gap: 10px; }
            .nav-btn { padding: 5px 8px; font-size: 18px; }
            .search-wrapper { min-width: 100%; }
            .map-controls { bottom: 12px; }
        }

        input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: none !important;
            appearance: none !important;
            height: 16px;
            width: 16px;
            display: inline-block;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'/></svg>");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            margin-left: 5px;
        }

        input[type="search"]::-webkit-search-decoration {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>

    <!-- ── VIEW CONTAINERS ──────────────────────────────────────────────
         Four views, stacked absolutely. Only one has .active at a time.
         constellation = 3D cosmos (Three.js)
         mindmap       = vis-network knowledge graph
         visual        = stat cards overview (Mission Control)
         cards         = searchable subject list (Topic Explorer)
         ──────────────────────────────────────────────────────────────── -->
    <div id="view-constellation" class="view active">
        <div class="page-header absolute-header">
            <h1>🌌 The Cosmos</h1>
            <p>Explore domains, subjects, and topics among the stars</p>
        </div>
        <div id="tooltip"></div>
        <div id="hint">🖱️ Drag to rotate • Scroll to zoom • Right-click to pan</div>
        <div id="vector-container"></div>
    </div>

    <div id="view-mindmap" class="view">
        <div class="page-header absolute-header">
            <h1>🕸️ Knowledge Web</h1>
            <p>See how everything connects</p>
        </div>
        <div id="mindmap-container"></div>        
        <div class="map-controls">
            <button onclick="MindmapView.setAnimation('pulse')" id="btn-anim-pulse" class="anim-btn active-mode">✨ Pulse</button>
            <button onclick="MindmapView.setAnimation('drift')" id="btn-anim-drift" class="anim-btn">🍃 Drift</button>
            <button onclick="MindmapView.setAnimation('static')" id="btn-anim-static" class="anim-btn">🔒 Static</button>
        </div>
    </div>

    <div id="view-visual" class="view">
        <div class="page-header">
            <h1>📡 Mission Control</h1>            
            <p>Survey every domain, subject, and topic at a glance</p>
        </div>
        <div class="stats-bar">
            <div class="stat"><div class="stat-num" id="stat-domains">0</div><div class="stat-label">Domains</div></div>
            <div class="stat"><div class="stat-num" id="stat-subs">0</div><div class="stat-label">Subjects</div></div>
            <div class="stat"><div class="stat-num" id="stat-topics">0</div><div class="stat-label">Topics</div></div>            
        </div>
        <div class="visual-grid" id="visual-grid"></div>
    </div>

    <div id="view-cards" class="view">
        <div class="page-header">
            <h1>🔍 Topic Explorer</h1>
        </div>
        <div class="controls">            
            <div class="search-wrapper">                
                <input type="text" id="search" placeholder="Search subject and topic..." oninput="CardsView.onSearchInput(this.value)">
                <span id="custom-clear-btn" onclick="CardsView.clearSearch()">&times;</span>
            </div>            

            <select id="domainFilter">
                <option value="all">All Domains</option>
            </select>
        </div>
        <div class="grid" id="grid"></div>
    </div>   

    <div id="side-panel">
        <button class="close-btn" onclick="Panel.close()">×</button>
        <div id="panel-content"></div>
    </div>

    <nav id="bottom-nav">
        <button class="nav-btn" onclick="switchView('constellation')" title="Home">🏠</button>
        <button class="nav-btn" onclick="prevView()" title="Previous View">&#8592;</button>
        <div class="dots-container">
            <div id="dot-constellation" class="nav-dot active" onclick="switchView('constellation')" title="The Cosmos"></div>
            <div id="dot-mindmap" class="nav-dot" onclick="switchView('mindmap')" title="Knowledge Web"></div>
            <div id="dot-visual" class="nav-dot" onclick="switchView('visual')" title="Mission Control"></div>
            <div id="dot-cards" class="nav-dot" onclick="switchView('cards')" title="Topic Explorer"></div>
        </div>
        <button class="nav-btn" onclick="nextView()" title="Next View">&#8594;</button>
        <div id="page-counter" style="color: var(--muted); font-size: 0.85rem; margin-left: 10px; font-variant-numeric: tabular-nums;">1/4</div>
    </nav>

<script src="course-curriculum.js"></script>

<script src="js/palette.js"></script>
<script src="js/parser.js"></script>
<script src="js/panel.js"></script>
<script src="js/view-cosmos.js"></script>
<script src="js/view-mindmap.js"></script>
<script src="js/view-cards.js"></script>
<script src="js/view-mission-control.js"></script>
<script src="js/app.js"></script>
</body>
</html>
